server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ── Ad scripts — first-party delivery (anti-adblock) ─────────────
    # Adsterra scripts are requested same-origin (/ads-serve/...) and
    # proxied server-side, so adblockers (which block the ad network's
    # domain but almost never the site's own origin) still load them.
    location /ads-serve/ {
        proxy_pass https://pimplehardnesscarnivorous.com/;
        proxy_set_header Host pimplehardnesscarnivorous.com;
        proxy_ssl_server_name on;
    }

    # ── Monetag — first-party delivery (anti-adblock) ────────────────
    location /monetag-serve/ {
        proxy_pass https://3nbf4.com/;
        proxy_set_header Host 3nbf4.com;
        proxy_ssl_server_name on;
    }

    location /moviebox-api/ {
        proxy_pass http://152.42.223.175:8000/;
        proxy_set_header Host 152.42.223.175:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
