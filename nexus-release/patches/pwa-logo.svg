<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- NEXUS Logo: stylized N with streaming bars and accent -->
  <defs>
    <linearGradient id="nexus-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B81D24"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Streaming bars (left side) - signal indicator -->
  <rect x="26" y="130" width="8" height="20" rx="2" fill="url(#accent-grad)" opacity="0.4"/>
  <rect x="38" y="118" width="8" height="32" rx="2" fill="url(#accent-grad)" opacity="0.6"/>
  <rect x="50" y="106" width="8" height="44" rx="2" fill="url(#accent-grad)" opacity="0.8"/>

  <!-- N letterform - bold stylized -->
  <path
    d="M62 58 L62 142 L80 142 L80 96 L120 142 L138 142 L138 58 L120 58 L120 104 L80 58 Z"
    fill="white"
    fill-rule="evenodd"
  />

  <!-- Red accent slash through N -->
  <polygon points="108,58 120,58 92,142 80,142" fill="url(#nexus-grad)"/>

  <!-- Streaming bars (right side) -->
  <rect x="154" y="130" width="8" height="20" rx="2" fill="url(#accent-grad)" opacity="0.4"/>
  <rect x="166" y="118" width="8" height="32" rx="2" fill="url(#accent-grad)" opacity="0.6"/>

  <!-- Bottom accent line -->
  <rect x="62" y="150" width="76" height="3" rx="1.5" fill="url(#nexus-grad)"/>
</svg>
